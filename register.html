<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/Vazirmatn-Variable-font-face.css">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/header_dark_mod.css">
    <link rel="stylesheet" href="./css/header_responsive.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/footer.css">
    <link rel="stylesheet" href="./css/form.css">
    <title>register</title>
</head>

<body>
    <header class="header">
        <div class="header__box header__box__right">
            <div class="brand__logo__box">
                <a href="#" class="brand">
                    بازارینو
                </a>
            </div>
            <nav><a href="#" class="pages">خانه</a></nav>
            <nav><a href="./products.html" class="pages">فروشگاه</a></nav>
            <nav><a href="#" class="pages">دسته‌بندی‌ها</a></nav>
            <nav><a href="#" class="pages">درباره ما</a></nav>
        </div>
        <div class="header__box header__box__left">
            <button class="button buy__basket__button">سبد خرید · <span>۲</span></button>
        </div>
    </header>
    <form action="#" method="post" class="form">
        <h1 class="title text">ساخت حساب کاربری</h1>
        <aside class="explanation text">برای خرید سریع‌تر، حساب بازارینو را بسازید.</aside>
        <div class="input__holder">
            <label for="email_input">ایمیل</label>
            <input type="email" name="email" id="email_input" class="input" placeholder="name@example.com" required>
            <label for="phone_number_input">شماره همراه</label>
            <input type="number" name="phone_number" id="phone_number_input" class="input" placeholder="09123456789" required>
            <label for="password_input">رمزعبور</label>
            <input type="password" name="password" id="password_input" class="input" minlength="8" placeholder="حداقل ۸ کاراکتر" required>
            <label for="passeord_repitition_input">تکرار رمزعبور</label>
            <input type="password" name="passeord_repitition" id="passeord_repitition_input" class="input" minlength="8" placeholder="رمزعبور را دوباره وارد کنید" required>
        </div>
        <div class="button__holder">
            <button type="reset" class="button form__button reset__button">پاک کردن</button>
            <button class="button form__button register__button">ثبت‌نام</button>
        </div>
    </form>
    <footer class="footer">
        <div>بازارینو؛ خرید ساده و مطمئن</div>
        <div class="footer__pages">
            <nav><a href="#" class="footer__nav__pages">پشتیبانی</a></nav> · <nav><a href="#"
                    class="footer__nav__pages">قوانین و شرایط </a></nav> · <nav><a class="footer__nav__pages"
                    href="#">اینستاگرام</a>
            </nav>
        </div>
        <div>© ۱۴۰۵</div>
    </footer>
</body>
</html>
